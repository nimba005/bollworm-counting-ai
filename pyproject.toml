[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bollworm"
version = "0.1.0"
description = "Wadhwani AI Bollworm Counting Challenge (Zindi) - detect & count ABW/PBW moths"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
